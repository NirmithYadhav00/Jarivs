name: frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  just_audio: ^0.9.38

  # Network
  http: ^1.2.0
  url_launcher: ^6.2.5

  # State Management
  flutter_riverpod: ^2.5.1

  # Permissions
  permission_handler: ^11.3.1

  # Android Features
  device_apps: ^2.2.0
  android_intent_plus: ^4.0.0
  flutter_contacts: ^1.1.7

  # AI Helpers
  string_similarity: ^2.0.0

  # Avatar
  model_viewer_plus: ^1.7.0
  video_player: ^2.9.1
  webview_flutter: ^4.9.0
  flutter_inappwebview: ^6.1.5
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.2

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: 12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatar/lucky_viewer.html
    - assets/avatar/three.min.js
    - assets/avatar/GLTFLoader.js
    - assets/avatar/three-vrm.js
    - assets/avatar/Lucky.vrm
