<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
canvas{display:block;width:100%!important;height:100%!important;}
</style>
</head>
<body>

<!-- FIX: Global error handler — logs any JS/script load failures to
     flutter logcat so you can diagnose missing asset files -->
<script>
window.onerror = function(msg, src, line, col, err) {
  console.error("[Lucky] JS ERROR: " + msg + " | src: " + src + " | line: " + line);
  return false;
};
</script>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="three-vrm.js"></script>
<script>

// ── Android WebGL fix ────────────────────────────────────────────────────────
(function(){
  if(typeof THREE_VRM==="undefined"){
    for(const ns of [typeof globalThis!=="undefined"?globalThis:null, typeof self!=="undefined"?self:null]){
      if(ns&&ns.THREE_VRM){window.THREE_VRM=ns.THREE_VRM;break;}
    }
  }
})();

// ── Renderer ─────────────────────────────────────────────────────────────────
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: true,
    precision: 'mediump',
    powerPreference: 'default',
    preserveDrawingBuffer: false,
  });
} catch(e) {
  console.error("[Lucky] WebGLRenderer failed, trying experimental-webgl: " + e);
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('experimental-webgl', {alpha:true});
  renderer = new THREE.WebGLRenderer({canvas, context:gl, antialias:false, alpha:true});
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 50);

// ── Lights ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(0.5, 2, 2);
scene.add(dirLight);
const rimL = new THREE.DirectionalLight(0x00D4FF, 1.2);
rimL.position.set(-3, 1, 0.5);
scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xFF00AA, 1.0);
rimR.position.set(3, 1, 0.5);
scene.add(rimR);

// ── State ─────────────────────────────────────────────────────────────────────
let vrm        = null;
let isTalking  = false;
let isThinking = false;
let thinkT = 0, thinkHandRaise = 0;

// Blink
let blinkPhase = "open", blinkTimer = 0, blinkInterval = 2.5 + Math.random()*3, blinkT = 0;
let blinkName = "blink";

// Eye dart
let eyeDartTimer = 0, eyeDartInterval = 2 + Math.random()*2.5;
let eyeDartX = 0, eyeDartY = 0, eyeTargetX = 0, eyeTargetY = 0;

// Motion timers
let breatheT = 0, swayT = 0, headBobT = 0;

// Lip sync
let externalAmp = 0.0, smoothedAmp = 0.0;
const MOUTH_SETS = [
  ["aa","ih","ou","ee","oh"],
  ["A","I","U","E","O"],
  ["a","i","u","e","o"],
  ["Fcl_MTH_A","Fcl_MTH_I","Fcl_MTH_U","Fcl_MTH_E","Fcl_MTH_O"],
];
let mouthShapes = MOUTH_SETS[0];
let curMouth = 0, mouthTimer = 0;

// Emotion
const EMO_KEYS = ["happy","sad","angry","surprised","relaxed","neutral"];
const emoCur = {}, emoTgt = {};
EMO_KEYS.forEach(k => { emoCur[k]=0; emoTgt[k]=0; });

// ── VRM receive ───────────────────────────────────────────────────────────────
window.receiveVRM = function(base64) {
  try {
    const bin   = atob(base64);
    const len   = bin.length;
    const bytes = new Uint8Array(len);
    const dv = new DataView(bytes.buffer);
    let i = 0;
    for (; i + 3 < len; i += 4) {
      dv.setUint32(i,
        (bin.charCodeAt(i)   << 24) |
        (bin.charCodeAt(i+1) << 16) |
        (bin.charCodeAt(i+2) <<  8) |
         bin.charCodeAt(i+3), false);
    }
    for (; i < len; i++) bytes[i] = bin.charCodeAt(i);

    const loader = new THREE.GLTFLoader();
    loader.register(p => new THREE_VRM.VRMLoaderPlugin(p, {autoUpdateHumanBones:true}));
    loader.parse(bytes.buffer, "",
      gltf => {
        const v = gltf.userData.vrm;
        if (v) onVRMReady(v);
        else console.error("[Lucky] VRM userData missing — check VRM file version");
      },
      err => console.error("[Lucky] Parse error:", err)
    );
  } catch(e) { console.error("[Lucky] receiveVRM error:", e); }
};

// ── VRM ready ─────────────────────────────────────────────────────────────────
function onVRMReady(loaded) {
  vrm = loaded;
  if (THREE_VRM.VRMUtils) THREE_VRM.VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  setRestPose();

  const box = new THREE.Box3().setFromObject(vrm.scene);
  vrm.scene.position.y -= box.min.y;

  const headY = box.max.y * 0.78;
  camera.position.set(0, headY, 1.4);
  camera.lookAt(0, headY + 0.1, 0);
  camera.updateProjectionMatrix();

  probeMorphs();
  setEmoTarget("relaxed");
  animate();

  // Tell Flutter — VRM is ready, flush JS queue
  try { window.flutter_inappwebview.callHandler("onVRMReady"); } catch(e) {
    console.error("[Lucky] Could not call onVRMReady handler:", e);
  }
}

// ── Rest pose ─────────────────────────────────────────────────────────────────
function setRestPose() {
  const b = n => { try { return vrm.humanoid.getNormalizedBoneNode(n); } catch(e) { return null; } };
  const lu = b("leftUpperArm"),  ru = b("rightUpperArm");
  const ll = b("leftLowerArm"),  rl = b("rightLowerArm");
  if (lu) lu.rotation.z =  1.2;
  if (ru) ru.rotation.z = -1.2;
  if (ll) ll.rotation.z =  0.2;
  if (rl) rl.rotation.z = -0.2;
}

// ── Probe which morph names exist in this VRM ─────────────────────────────────
function probeMorphs() {
  if (!vrm || !vrm.expressionManager) return;
  const em = vrm.expressionManager;

  function exists(name) {
    try {
      em.setValue(name, 0.01);
      const v = em.getValue(name);
      em.setValue(name, 0);
      return v !== null && v !== undefined;
    } catch(e) { return false; }
  }

  for (const set of MOUTH_SETS) {
    if (exists(set[0])) { mouthShapes = set; break; }
  }

  for (const name of ["blink","Blink","blinkLeft","Fcl_EYE_Close","blinkL"]) {
    if (exists(name)) { blinkName = name; break; }
  }
}

// ── Expression helpers ────────────────────────────────────────────────────────
function setExpr(name, val) {
  if (!vrm || !vrm.expressionManager || !name) return;
  try { vrm.expressionManager.setValue(name, Math.max(0, Math.min(1, val))); } catch(e) {}
}
function stopMouth() { mouthShapes.forEach(s => setExpr(s, 0)); }
function setBlink(v) {
  setExpr(blinkName, v);
  if (blinkName === "blinkLeft") setExpr("blinkRight", v);
}

// ── Emotion ───────────────────────────────────────────────────────────────────
function setEmoTarget(emo) {
  EMO_KEYS.forEach(k => { emoTgt[k] = 0; });
  if (emoTgt.hasOwnProperty(emo)) emoTgt[emo] = 1;
}
function updateEmotions(dt) {
  EMO_KEYS.forEach(k => {
    emoCur[k] += (emoTgt[k] - emoCur[k]) * 3.0 * dt;
    emoCur[k]  = Math.max(0, Math.min(1, emoCur[k]));
    if (k !== "neutral") setExpr(k, emoCur[k]);
  });
}

// ── Lip sync ──────────────────────────────────────────────────────────────────
window.setAmplitude = function(val) {
  externalAmp = Math.max(0, Math.min(1, parseFloat(val) || 0));
};

function lipSync(dt) {
  if (externalAmp > smoothedAmp) smoothedAmp += (externalAmp - smoothedAmp) * 25 * dt;
  else                            smoothedAmp += (externalAmp - smoothedAmp) * 12 * dt;
  smoothedAmp = Math.max(0, Math.min(1, smoothedAmp));

  if (smoothedAmp < 0.02) { stopMouth(); return; }

  const cycleTime = Math.max(0.035, 0.13 - smoothedAmp * 0.09);
  mouthTimer += dt;
  if (mouthTimer >= cycleTime) {
    mouthTimer = 0;
    setExpr(mouthShapes[curMouth], 0);
    const w = smoothedAmp > 0.5
      ? [0.35, 0.12, 0.18, 0.10, 0.25]
      : [0.18, 0.28, 0.14, 0.28, 0.12];
    let r = Math.random(), acc = 0;
    for (let i = 0; i < w.length; i++) { acc += w[i]; if (r < acc) { curMouth = i; break; } }
  }
  setExpr(mouthShapes[curMouth], Math.pow(smoothedAmp, 0.6));
}

// ── Blink ─────────────────────────────────────────────────────────────────────
function blink(dt) {
  blinkTimer += dt;
  if (blinkPhase === "open" && blinkTimer >= blinkInterval) {
    blinkPhase = "closing"; blinkTimer = 0; blinkT = 0;
  }
  if (blinkPhase === "closing") {
    blinkT += dt / 0.06;
    setBlink(Math.min(blinkT, 1));
    if (blinkT >= 1) { blinkPhase = "closed"; blinkT = 0; }
  }
  if (blinkPhase === "closed") {
    blinkT += dt;
    if (blinkT >= 0.04) { blinkPhase = "opening"; blinkT = 0; }
  }
  if (blinkPhase === "opening") {
    blinkT += dt / 0.07;
    setBlink(1 - Math.min(blinkT, 1));
    if (blinkT >= 1) {
      blinkPhase = "open"; blinkTimer = 0;
      blinkInterval = 2.5 + Math.random() * 3.5;
      setBlink(0);
    }
  }
}

// ── Eye dart ──────────────────────────────────────────────────────────────────
function eyeDart(dt) {
  eyeDartTimer += dt;
  if (eyeDartTimer >= eyeDartInterval) {
    eyeDartTimer = 0; eyeDartInterval = 1.5 + Math.random() * 2.5;
    if (Math.random() < 0.3) { eyeTargetX = 0; eyeTargetY = 0; }
    else { eyeTargetX = (Math.random()-0.5)*0.016; eyeTargetY = (Math.random()-0.5)*0.008; }
  }
  eyeDartX += (eyeTargetX - eyeDartX) * 8 * dt;
  eyeDartY += (eyeTargetY - eyeDartY) * 8 * dt;
  try {
    const le = vrm.humanoid.getNormalizedBoneNode("leftEye");
    const re = vrm.humanoid.getNormalizedBoneNode("rightEye");
    if (le) { le.rotation.y = eyeDartX; le.rotation.x = eyeDartY; }
    if (re) { re.rotation.y = eyeDartX; re.rotation.x = eyeDartY; }
  } catch(e) {}
}

// ── Breathe ───────────────────────────────────────────────────────────────────
function breathe(dt) {
  breatheT += dt; swayT += dt;
  const b = Math.sin(breatheT * 0.4 * Math.PI) * 0.5 + 0.5;
  const boost = isTalking ? 1.4 : 1.0;
  try {
    const spine = vrm.humanoid.getNormalizedBoneNode("spine");
    const chest = vrm.humanoid.getNormalizedBoneNode("chest");
    const hips  = vrm.humanoid.getNormalizedBoneNode("hips");
    if (spine) { spine.rotation.x = b * 0.014 * boost; spine.position.y = b * 0.003; }
    if (chest)   chest.rotation.x = b * 0.009 * boost;
    if (hips)    hips.rotation.z  = Math.sin(swayT * 0.3) * 0.007;
  } catch(e) {}
}

// ── Shoulder sway ─────────────────────────────────────────────────────────────
function shoulderSway() {
  try {
    const ls = vrm.humanoid.getNormalizedBoneNode("leftShoulder");
    const rs = vrm.humanoid.getNormalizedBoneNode("rightShoulder");
    if (ls) ls.rotation.z =  Math.sin(swayT * 0.4) * 0.010;
    if (rs) rs.rotation.z = -Math.sin(swayT * 0.4) * 0.010;
  } catch(e) {}
}

// ── Head motion ───────────────────────────────────────────────────────────────
function headMotion(dt) {
  headBobT += dt;
  if (isThinking || thinkHandRaise > 0.01) return;
  try {
    const head = vrm.humanoid.getNormalizedBoneNode("head");
    if (!head) return;
    if (isTalking) {
      head.rotation.x = Math.sin(headBobT * 3.0) * 0.025 + Math.sin(headBobT * 1.4) * 0.008;
      head.rotation.y = Math.sin(headBobT * 1.7) * 0.020;
      head.rotation.z = Math.sin(headBobT * 2.0) * 0.007;
    } else {
      head.rotation.x = Math.sin(headBobT * 0.45) * 0.007;
      head.rotation.y = Math.sin(headBobT * 0.28) * 0.010;
      head.rotation.z = Math.sin(headBobT * 0.18) * 0.004;
    }
  } catch(e) {}
}

// ── Thinking pose ─────────────────────────────────────────────────────────────
function applyThinkingPose(dt) {
  if (!vrm) return;
  if (isThinking) {
    thinkT += dt;
    thinkHandRaise = Math.min(1, thinkHandRaise + dt * 2.0);
  } else {
    thinkHandRaise = Math.max(0, thinkHandRaise - dt * 2.5);
    if (thinkHandRaise < 0.01) { thinkT = 0; return; }
  }
  const r    = thinkHandRaise;
  const sway = isThinking ? Math.sin(thinkT * 1.2) * 0.008 : 0;
  try {
    const rua = vrm.humanoid.getNormalizedBoneNode("rightUpperArm");
    if (rua) { rua.rotation.z = -1.2 + r*0.85; rua.rotation.x = r*0.3; }
    const rla = vrm.humanoid.getNormalizedBoneNode("rightLowerArm");
    if (rla) { rla.rotation.z = -0.2 - r*0.5; rla.rotation.x = r*0.6; }
    const rh = vrm.humanoid.getNormalizedBoneNode("rightHand");
    if (rh) rh.rotation.x = r * 0.3;
    const head = vrm.humanoid.getNormalizedBoneNode("head");
    if (head) { head.rotation.z = r*-0.12 + sway; head.rotation.x = r*-0.04; head.rotation.y = r*0.06; }
    if (isThinking) setExpr("ou", 0.15 + Math.sin(thinkT * 0.8) * 0.07);
  } catch(e) {}
}

// ── External API ──────────────────────────────────────────────────────────────
window.startTalking = function(emotion) {
  isTalking  = true;
  isThinking = false;
  thinkHandRaise = 0;
  setExpr("ou", 0);
  setEmoTarget(emotion || "relaxed");
};

window.stopTalking = function() {
  isTalking   = false;
  externalAmp = 0;
  setEmoTarget("relaxed");
};

window.setThinkingPose = function(active) {
  isThinking = !!active;
  if (!active) { thinkHandRaise = 0; thinkT = 0; setExpr("ou", 0); }
};

window.setEmotion = function(emo) { setEmoTarget(emo); };

// Flutter message bridge
window.addEventListener("message", function(e) {
  try {
    const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (!d || !d.type) return;
    if (d.type === "startTalking")  window.startTalking(d.emotion);
    if (d.type === "stopTalking")   window.stopTalking();
    if (d.type === "setEmotion")    window.setEmotion(d.emotion);
    if (d.type === "setState") {
      if (d.state === "talking")  { window.startTalking("relaxed"); }
      if (d.state === "idle")     { window.stopTalking(); window.setThinkingPose(false); }
      if (d.state === "thinking") { window.setThinkingPose(true); setEmoTarget("neutral"); }
    }
  } catch(err) {}
});

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!vrm) return;
  try {
    blink(dt);
    eyeDart(dt);
    breathe(dt);
    shoulderSway();
    headMotion(dt);
    applyThinkingPose(dt);
    updateEmotions(dt);
    lipSync(dt);
    vrm.update(dt);
  } catch(e) { console.error("[Lucky] Anim error:", e); }
  renderer.render(scene, camera);
}

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
