<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #debug {
      position: fixed; bottom: 0; left: 0; right: 0;
      color: lime; font-size: 11px; background: rgba(0,0,0,0.6);
      padding: 4px; z-index: 999; word-break: break-all;
    }
  </style>
</head>
<body>
<div id="debug">Starting...</div>

<!-- Three.js core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const dbg = document.getElementById('debug');
function log(msg) { console.log(msg); dbg.textContent = msg; }

log('Three.js: ' + (typeof THREE !== 'undefined' ? 'OK' : 'FAILED'));
</script>

<!-- GLTFLoader for r128 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
log('GLTFLoader: ' + (typeof THREE.GLTFLoader !== 'undefined' ? 'OK' : 'FAILED'));
</script>

<!-- three-vrm UMD bundle -->
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.12/lib/three-vrm.js"></script>

<script>
log('three-vrm: ' + (typeof THREE_VRM !== 'undefined' ? 'OK' : 'FAILED'));

// ── Scene ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 1.4, 3.5);
camera.lookAt(0, 1.0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(1, 2, 3);
scene.add(dir);

// ── State ──────────────────────────────────────────────────────────────
let vrm = null;
let avatarState = 'idle';
let isTalking = false;
let blinkTimer = 0, blinkInterval = rndBlink(), blinkPhase = 'open', blinkT = 0;
let breatheT = 0, swayT = 0, headBobT = 0;
let mouthTimer = 0, mouthInterval = 0.12;
const mouthShapes = ['aa', 'ih', 'ou', 'ee', 'oh'];

function rndBlink() { return 2.5 + Math.random() * 3.5; }

// ── Load VRM ───────────────────────────────────────────────────────────
log('Loading VRM...');
const loader = new THREE.GLTFLoader();
THREE_VRM.VRMUtils && loader.register
  ? loader.register(p => new THREE_VRM.VRMLoaderPlugin(p))
  : null;

loader.load(
  'Lucky.vrm',
  (gltf) => {
    log('VRM loaded!');
    vrm = gltf.userData.vrm;
    if (THREE_VRM.VRMUtils) THREE_VRM.VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);

    const box = new THREE.Box3().setFromObject(vrm.scene);
    const center = box.getCenter(new THREE.Vector3());
    vrm.scene.position.sub(center);
    vrm.scene.position.y += box.getSize(new THREE.Vector3()).y * 0.5 - 0.1;

    setTimeout(() => dbg.style.display = 'none', 3000);
    animate();
  },
  xhr => log('VRM: ' + (xhr.total > 0 ? (xhr.loaded/xhr.total*100).toFixed(0)+'%' : xhr.loaded+' bytes')),
  err => log('VRM ERROR: ' + (err.message || err))
);

// ── Flutter messages ───────────────────────────────────────────────────
window.addEventListener('message', e => {
  try {
    const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (!d) return;
    if (d.type === 'setState') { avatarState = d.state; isTalking = d.state === 'talking'; if (!isTalking) stopMouth(); }
    else if (d.type === 'startTalking') { isTalking = true; avatarState = 'talking'; }
    else if (d.type === 'stopTalking') { isTalking = false; avatarState = 'idle'; stopMouth(); }
  } catch(_) {}
});

// ── Helpers ────────────────────────────────────────────────────────────
function setExpr(name, val) {
  if (!vrm) return;
  try { vrm.expressionManager?.setValue(name, val); } catch(_) {}
}
function stopMouth() { mouthShapes.forEach(s => setExpr(s, 0)); }

// ── Animate ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (vrm) { blink(dt); breathe(dt); if (isTalking) lipSync(dt); headMotion(dt); vrm.update(dt); }
  renderer.render(scene, camera);
}

function blink(dt) {
  blinkTimer += dt;
  if (blinkPhase === 'open' && blinkTimer >= blinkInterval) { blinkPhase = 'closing'; blinkTimer = 0; blinkT = 0; }
  if (blinkPhase === 'closing') { blinkT += dt/0.07; const v = Math.min(blinkT,1); setExpr('blinkLeft',v); setExpr('blinkRight',v); if (blinkT>=1){blinkPhase='closed';blinkT=0;} }
  if (blinkPhase === 'closed') { blinkT += dt; if (blinkT>=0.05){blinkPhase='opening';blinkT=0;} }
  if (blinkPhase === 'opening') { blinkT += dt/0.08; const v=1-Math.min(blinkT,1); setExpr('blinkLeft',v); setExpr('blinkRight',v); if (blinkT>=1){blinkPhase='open';blinkTimer=0;blinkInterval=rndBlink();} }
}

function breathe(dt) {
  breatheT += dt; swayT += dt;
  const b = Math.sin(breatheT * 0.4 * Math.PI) * 0.5 + 0.5;
  const spine = vrm.humanoid?.getNormalizedBoneNode('spine');
  if (spine) { spine.rotation.x = b*0.015; spine.position.y = b*0.003; }
  const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
  if (chest) chest.rotation.x = b*0.01;
  const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
  if (hips) hips.rotation.z = Math.sin(swayT*0.3)*0.008;
}

function lipSync(dt) {
  mouthTimer += dt;
  if (mouthTimer >= mouthInterval) {
    mouthTimer = 0; mouthInterval = 0.08 + Math.random()*0.1;
    stopMouth();
    setExpr(mouthShapes[Math.floor(Math.random()*mouthShapes.length)], 0.3+Math.random()*0.6);
  }
}

function headMotion(dt) {
  headBobT += dt;
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  if (!head) return;
  if (isTalking) { head.rotation.x = Math.sin(headBobT*3.5)*0.025; head.rotation.y = Math.sin(headBobT*1.8)*0.02; }
  else if (avatarState==='listening') { head.rotation.z = Math.sin(headBobT*0.8)*0.03; head.rotation.y = -0.05; }
  else if (avatarState==='thinking') { head.rotation.x = -0.04; head.rotation.y = 0.06; }
  else { head.rotation.x = Math.sin(headBobT*0.5)*0.01; head.rotation.y = Math.sin(headBobT*0.3)*0.015; head.rotation.z = 0; }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
