<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.3/lib/three-vrm.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ── Scene ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 1.4, 3.5);
camera.lookAt(0, 1.0, 0);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(1, 2, 3);
scene.add(dir);

// ── State ──────────────────────────────────────────────────────────────────
let vrm = null;
let avatarState = 'idle'; // idle | listening | thinking | talking
let isTalking = false;

// Timers
let blinkTimer = 0;
let blinkInterval = randomBlink();
let blinkPhase = 'open'; // open | closing | closed | opening
let blinkT = 0;

let breatheT = 0;
let mouthT = 0;
let headBobT = 0;
let swayT = 0;

// Lip sync syllable targets
const mouthShapes = ['aa', 'ih', 'ou', 'ee', 'oh'];
let currentMouthTarget = 0;
let mouthChangeTimer = 0;
let mouthChangeInterval = 0.12;

function randomBlink() { return 2.5 + Math.random() * 3.5; }

// ── Load VRM ───────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
  'file:///android_asset/flutter_assets/assets/avatar/Lucky.vrm',
  (gltf) => {
    vrm = gltf.userData.vrm;
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);

    // Center avatar
    const box = new THREE.Box3().setFromObject(vrm.scene);
    const center = box.getCenter(new THREE.Vector3());
    vrm.scene.position.sub(center);
    vrm.scene.position.y += box.getSize(new THREE.Vector3()).y * 0.5 - 0.1;

    console.log('VRM loaded');
    animate();
  },
  (progress) => console.log('Loading:', (progress.loaded / progress.total * 100).toFixed(1) + '%'),
  (err) => console.error('VRM load error:', err)
);

// ── Flutter → JS messages ─────────────────────────────────────────────────
window.addEventListener('message', (e) => {
  try {
    const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    handleCommand(data);
  } catch (_) {}
});

// Also handle Flutter InAppWebView channel
window.flutterChannel = {
  postMessage: (msg) => {
    try {
      const data = typeof msg === 'string' ? JSON.parse(msg) : msg;
      handleCommand(data);
    } catch (_) {}
  }
};

function handleCommand(data) {
  if (!data || !data.type) return;
  switch (data.type) {
    case 'setState':
      avatarState = data.state; // idle | listening | thinking | talking
      isTalking = data.state === 'talking';
      if (!isTalking) stopMouth();
      break;
    case 'startTalking':
      isTalking = true;
      avatarState = 'talking';
      break;
    case 'stopTalking':
      isTalking = false;
      avatarState = 'idle';
      stopMouth();
      break;
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setExpression(name, value) {
  if (!vrm) return;
  try { vrm.expressionManager?.setValue(name, value); } catch (_) {}
}

function getExpression(name) {
  if (!vrm) return 0;
  try { return vrm.expressionManager?.getValue(name) ?? 0; } catch (_) { return 0; }
}

function lerp(a, b, t) { return a + (b - a) * t; }

function stopMouth() {
  setExpression('aa', 0);
  setExpression('ih', 0);
  setExpression('ou', 0);
  setExpression('ee', 0);
  setExpression('oh', 0);
}

// ── Animation Loop ────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (vrm) {
    updateBlink(dt);
    updateBreathing(dt);
    if (isTalking) updateLipSync(dt);
    updateHeadMotion(dt);
    vrm.update(dt);
  }

  renderer.render(scene, camera);
}

// ── Blinking ──────────────────────────────────────────────────────────────
function updateBlink(dt) {
  blinkTimer += dt;

  if (blinkPhase === 'open' && blinkTimer >= blinkInterval) {
    blinkPhase = 'closing';
    blinkTimer = 0;
    blinkT = 0;
  }

  if (blinkPhase === 'closing') {
    blinkT += dt / 0.07; // 70ms to close
    const v = Math.min(blinkT, 1);
    setExpression('blinkLeft', v);
    setExpression('blinkRight', v);
    if (blinkT >= 1) { blinkPhase = 'closed'; blinkT = 0; }
  }

  if (blinkPhase === 'closed') {
    blinkT += dt;
    if (blinkT >= 0.05) { blinkPhase = 'opening'; blinkT = 0; }
  }

  if (blinkPhase === 'opening') {
    blinkT += dt / 0.08; // 80ms to open
    const v = 1 - Math.min(blinkT, 1);
    setExpression('blinkLeft', v);
    setExpression('blinkRight', v);
    if (blinkT >= 1) {
      blinkPhase = 'open';
      blinkTimer = 0;
      blinkInterval = randomBlink();
    }
  }
}

// ── Breathing ────────────────────────────────────────────────────────────
function updateBreathing(dt) {
  breatheT += dt;
  const breath = Math.sin(breatheT * 0.4 * Math.PI) * 0.5 + 0.5; // 0–1 slow cycle

  // Move chest bones slightly if available
  const spine = vrm.humanoid?.getNormalizedBoneNode('spine');
  if (spine) {
    spine.rotation.x = breath * 0.015;
    spine.position.y = breath * 0.003;
  }

  const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
  if (chest) {
    chest.rotation.x = breath * 0.01;
  }

  // Subtle sway
  swayT += dt;
  const sway = Math.sin(swayT * 0.3) * 0.008;
  const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
  if (hips) hips.rotation.z = sway;
}

// ── Lip Sync ─────────────────────────────────────────────────────────────
function updateLipSync(dt) {
  mouthChangeTimer += dt;

  if (mouthChangeTimer >= mouthChangeInterval) {
    mouthChangeTimer = 0;
    mouthChangeInterval = 0.08 + Math.random() * 0.1;

    // Clear all mouth shapes
    stopMouth();

    // Pick a random shape and open it
    const shape = mouthShapes[Math.floor(Math.random() * mouthShapes.length)];
    const openAmount = 0.3 + Math.random() * 0.6;
    setExpression(shape, openAmount);
  }
}

// ── Head Motion ──────────────────────────────────────────────────────────
function updateHeadMotion(dt) {
  headBobT += dt;

  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  if (!head) return;

  if (isTalking) {
    // Subtle nod while talking
    head.rotation.x = Math.sin(headBobT * 3.5) * 0.025;
    head.rotation.y = Math.sin(headBobT * 1.8) * 0.02;
  } else if (avatarState === 'listening') {
    // Slight tilt while listening
    head.rotation.z = Math.sin(headBobT * 0.8) * 0.03;
    head.rotation.y = -0.05; // lean slightly toward user
  } else if (avatarState === 'thinking') {
    // Look slightly up-right
    head.rotation.x = -0.04;
    head.rotation.y = 0.06;
  } else {
    // Idle — gentle floating look
    head.rotation.x = Math.sin(headBobT * 0.5) * 0.01;
    head.rotation.y = Math.sin(headBobT * 0.3) * 0.015;
    head.rotation.z = 0;
  }
}

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
